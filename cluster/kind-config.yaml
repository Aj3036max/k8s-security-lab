# Cluster local kind : 1 control-plane + 2 workers.
# Le CNI par défaut de kind (kindnet) n'applique PAS les NetworkPolicies : on le désactive et on installe Calico.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: seclab
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            # Journal d'audit de l'API server
            audit-log-path: /var/log/kubernetes/audit.log
            audit-policy-file: /etc/kubernetes/policies/audit-policy.yaml
            audit-log-maxage: "7"
          extraVolumes:
            - name: audit-policies
              hostPath: /etc/kubernetes/policies
              mountPath: /etc/kubernetes/policies
              readOnly: true
              pathType: DirectoryOrCreate
            - name: audit-logs
              hostPath: /var/log/kubernetes
              mountPath: /var/log/kubernetes
              readOnly: false
              pathType: DirectoryOrCreate
    extraMounts:
      - hostPath: ./cluster/audit-policy.yaml
        containerPath: /etc/kubernetes/policies/audit-policy.yaml
        readOnly: true
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
  - role: worker
  - role: worker
