# Policy as Code avec Kyverno (>= 1.20) : ValidatingPolicy écrites en CEL (Common Expression Language),
# le même langage que les ValidatingAdmissionPolicy natives de Kubernetes.
# validationActions: [Deny] => les ressources non conformes sont REFUSÉES par l'API server.
# (Les anciennes ClusterPolicy kyverno.io/v1 ne sont plus acceptées depuis Kyverno 1.20.)
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Interdire le tag "latest"
    policies.kyverno.io/description: >-
      Le tag latest est mutable : on ne sait pas quelle version tourne, et une image
      compromise peut être poussée sous ce tag. Imposer une version explicite.
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: secure-app
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: "object.spec.containers.all(c, c.image.contains(':') && !c.image.endsWith(':latest'))"
      message: "Les images doivent avoir un tag explicite différent de 'latest'."
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Limites CPU / mémoire obligatoires
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: secure-app
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        object.spec.containers.all(c,
          has(c.resources) && has(c.resources.limits) &&
          'cpu' in c.resources.limits && 'memory' in c.resources.limits)
      message: "Chaque conteneur doit définir resources.limits.cpu et resources.limits.memory."
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Registres d'images autorisés
    policies.kyverno.io/description: Limite la supply chain aux registres de confiance.
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: secure-app
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: allowed
      expression: "['nginxinc/', 'docker.io/nginxinc/', 'ghcr.io/aj3036max/', 'registry.k8s.io/']"
  validations:
    - expression: "object.spec.containers.all(c, variables.allowed.exists(r, c.image.startsWith(r)))"
      message: "Image refusée : registres autorisés = docker.io/nginxinc, ghcr.io/aj3036max, registry.k8s.io."
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-readonly-rootfs
  annotations:
    policies.kyverno.io/title: Système de fichiers racine en lecture seule
    policies.kyverno.io/description: >-
      Empêche un attaquant d'écrire des binaires ou de modifier la configuration dans le conteneur.
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: secure-app
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        object.spec.containers.all(c,
          has(c.securityContext) && has(c.securityContext.readOnlyRootFilesystem) &&
          c.securityContext.readOnlyRootFilesystem == true)
      message: "securityContext.readOnlyRootFilesystem doit être true."
