apiVersion: v1
kind: Pod
metadata:
  name: evil-hostpath
  namespace: secure-app
spec:
  containers:
    - name: shell
      image: nginxinc/nginx-unprivileged:1.27-alpine
      volumeMounts:
        - name: host-root
          mountPath: /host
      resources:
        limits: { cpu: 100m, memory: 64Mi }
  volumes:
    - name: host-root
      hostPath:
        path: /
